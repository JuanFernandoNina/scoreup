{% macro badge(tone, text) -%}
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if tone == 'green' %}bg-emerald-100 text-emerald-800{% elif tone == 'red' %}bg-rose-100 text-rose-800
  {% elif tone == 'amber' %}bg-amber-100 text-amber-800{% elif tone == 'blue' %}bg-sky-100 text-sky-800
  {% else %}bg-slate-100 text-slate-700{% endif %}">{{ text | safe }}</span>
{%- endmacro %}

{% macro card() -%}
<div class="rounded-2xl border border-slate-200 bg-white shadow-sm"> {{ caller() }} </div>
{%- endmacro %}
