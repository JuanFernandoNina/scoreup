{% extends "base.html" %}
{% block title %}QR no válido — Scoreup{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-16 text-center">
  <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-rose-100 text-3xl">⚠️</div>
  <h1 class="text-xl font-bold text-slate-800">QR no válido</h1>
  <p class="mt-2 text-sm text-slate-500">Este código QR no corresponde a ninguna mesa de evaluación o ya expiró. Verificá que sea el QR oficial impreso en la mesa del club.</p>
  <a href="{{ url_for('login') if not user else (url_for('panel_staff') if user and user.rol == 'staff' else '/') }}" class="mt-6 inline-block rounded-xl bg-cyan-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-cyan-800">Volver al inicio</a>
</div>
{% endblock %}
