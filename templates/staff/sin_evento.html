{% extends "base.html" %}
{% block title %}ScoreUp · Staff sin evento{% endblock %}
{% block body %}
<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-cyan-900 p-4">
  <div class="max-w-md rounded-3xl bg-white p-8 text-center shadow-2xl">
    <div class="flex h-16 w-16 items-center justify-center rounded-full bg-cyan-100 mx-auto mb-4">
      <span class="text-3xl">📋</span>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Sin evento asignado</h1>
    <p class="mt-3 text-sm text-slate-500">
      Hola {{ user.nombre }}. Aún no tienes un evento asociado.
      Contacta con el administrador para que te asigne a uno.
    </p>
    <a href="{{ url_for('logout') }}" class="mt-6 inline-block rounded-xl bg-cyan-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-cyan-800">
      Cerrar sesión
    </a>
  </div>
</div>
{% endblock %}
