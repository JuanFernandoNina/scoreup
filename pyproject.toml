[project]
name = "scoreup"
version = "1.0.0"
description = "ScoreUp: evaluación de clubes con QR, desplegada en Vercel + Supabase"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask>=3.0,<4.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "qrcode[pil]>=8.0,<9.0",
    "Flask-WTF>=1.2,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "opencv-python-headless>=4.9,<5.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
